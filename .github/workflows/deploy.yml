# .github/workflows/deploy.yml
name: Deploy to Elastic Beanstalk & GitHub Pages

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

on:
  push:
    branches:
      - main 

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Discord
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          curl -X POST -H "Content-Type: application/json" -d '{"content":"Starting update..."}' $WEBHOOK_URL

  deploy_eb:
    needs: start
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Zip application files
        run: zip -r deploy.zip . -x node_modules -x .github -x engine -x .git

      - name: Deploy to Elastic Beanstalk
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          EB_APP_NAME: ${{ secrets.EB_APP_NAME }}
          EB_ENV_NAME: ${{ secrets.EB_ENV_NAME }}
        run: |
          pip install --upgrade pip
          pip install awsebcli
          yes no | eb init "$EB_APP_NAME" --region "$AWS_REGION" --platform "node.js" -i
          yes | eb use "$EB_ENV_NAME"
          yes | eb deploy --staged

  deploy_pages:
    needs: start
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  finish:
    needs: [deploy_eb, deploy_pages]
    runs-on: ubuntu-latest
    steps:
      - name: Ping Discord
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          curl -X POST -H "Content-Type: application/json" -d '{"content":"Update finished, check $SITE_URL"}' $WEBHOOK_URL
