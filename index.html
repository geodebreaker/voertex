<!DOCTYPE html>
<html>

<head>
  <title>VOERTEX</title>
  <link href="./engine/assets/opaque.webp" rel="icon">
  <script src="./engine/lib/clone.js"></script>
  <script src="./engine/lib/p5.js"></script>
  <script src="./engine/class/player.js"></script>
  <script src="./engine/class/gobj.js"></script>
  <script src="./engine/3d.js"></script>
  <script src="./engine/multiplayer.js"></script>
  <script src="./engine/phys.js"></script>
  <script src="./engine/gui.js"></script>
  <script src="./engine/main.js"></script>
  <script src="./engine/cmd.js"></script>
  <meta property="og:title" content="VOERTEX">
  <meta property="og:description" content="A chatroom with RP features">
  <meta property="og:image" content="./engine/assets/clear.png">
  <meta property="og:image:type" content="image/png">
  <style>
    @font-face {
      font-family: 'Google Sans';
      src: url('./engine/assets/googlesans.ttf');
    }

    body {
      margin: 0px;
      background: #000;
      overflow: clip;
    }

    input {
      color: white;
      font-family: 'Google Sans';
      border: 2px solid #0006;
      background: #4448;
      outline: none;
      font-size: 15px;
      padding: 3px;
    }

    div {
      color: white;
      font-family: 'Google Sans';
      border: 2px solid #0006;
      background: #4448;
      outline: none;
      font-size: 12px;
      padding: 3px;
      overflow-x: scroll;
      overflow-y: scroll;
    }

    div:has(.listing) {
      padding: 0px;
    }

    .listing {
      display: block;
      font-size: 24px;
      border-bottom: 2px solid #000;
      background: #2228;
      padding: 4px;
      cursor: pointer;
    }

    .listing:hover {
      background: #4448;
    }

    .kh,
    .kr,
    .kh:hover,
    .kr:hover {
      background: #2228;
      cursor: default;
      font-weight: bold;
      white-space: pre;
    }

    .kh {
      font-size: 30px;
    }

    .plrs {
      float: right;
    }

    input::placeholder {
      color: #ccc;
    }
  </style>
</head>

</html>
